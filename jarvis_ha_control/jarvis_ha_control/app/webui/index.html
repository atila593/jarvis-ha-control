<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis HUD</title>
<style>
  :root { color-scheme: dark; --c:#00e5ff; --ok:#19e68c; --warn:#ffb020; --ko:#ff4d5e; --bg:#050b12; --panel:#08141d; --line:#0a3a47; --h:calc(100vh - 62px); }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:system-ui,sans-serif; background:radial-gradient(circle at 50% 0%, #0a2230, var(--bg) 60%); color:#cfeff5; min-height:100vh; }
  .wrap { max-width:2200px; margin:0 auto; padding:10px 14px; }
  header { display:flex; justify-content:space-between; align-items:center; height:34px; font-family:ui-monospace,monospace; color:var(--c); }
  .grid { display:grid; gap:12px; grid-template-columns:1fr 1.5fr 1fr; align-items:start; }
  .side { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .col { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .panel { background:rgba(8,20,29,.85); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:0 0 24px rgba(0,229,255,.06) inset; min-width:0; }
  h2 { margin:0 0 10px; font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--c); font-weight:600; }
  .item { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid #0a2531; align-items:flex-start; }
  .item:last-child { border:0; }
  .dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none; box-shadow:0 0 8px currentColor; }
  .ok{ color:var(--ok); background:var(--ok);} .warn{ color:var(--warn); background:var(--warn);} .ko{ color:var(--ko); background:var(--ko);}
  .item b { display:block; font-size:13px; color:#e8fbff; overflow-wrap:anywhere; } .item span.v { font-size:12px; color:#8fb3bd; }
  .empty { color:#6b8a94; font-size:13px; font-style:italic; }
  .sub-h { margin:12px 0 2px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#5f8f9b; }
  .sub-h:first-child { margin-top:0; }
  .center { display:flex; flex-direction:column; align-items:center; }
  .orb { width:96px; height:96px; border-radius:50%; margin:2px 0 6px; border:3px solid var(--oc,var(--c)); background:radial-gradient(circle, color-mix(in srgb,var(--oc,var(--c)) 45%,transparent), transparent 70%); box-shadow:0 0 26px var(--oc,var(--c)), 0 0 50px color-mix(in srgb,var(--oc,var(--c)) 40%,transparent) inset; animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.04); opacity:.85; } }
  .title { font-family:ui-monospace,monospace; font-size:18px; font-weight:700; color:var(--oc,var(--c)); letter-spacing:.08em; text-align:center; }
  .sub { font-size:12px; color:#7fa3ad; margin:3px 0 10px; text-align:center; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
  .dl { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:100%; margin-top:8px; }
  button, a.btn { background:#0b5cff; color:#fff; border:0; border-radius:8px; padding:10px 12px; font-weight:600; cursor:pointer; text-decoration:none; font-size:14px; text-align:center; display:block; }
  button:disabled { opacity:.5; cursor:wait; }
  .dl a, .dl button { background:#062a35; border:1px solid var(--c); color:var(--c); padding:7px 4px; font-size:12px; }
  #voice { background:#0a7a4a; }
  #log { width:100%; flex:1; min-height:150px; margin-top:10px; overflow-y:auto; background:#030a10; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; }
  .me { color:#8fa; } .bot { color:var(--c); margin-bottom:8px; }
  .bar { display:flex; gap:8px; width:100%; margin-top:8px; }
  input { flex:1; min-width:0; background:var(--panel); color:#e8fbff; border:1px solid var(--c); padding:10px; border-radius:8px; }

  /* Grand écran : 5 colonnes, chaque colonne défile seule, la page ne défile pas */
  @media (min-width:1500px) {
    .grid { grid-template-columns:1fr 1fr 1.7fr 1fr 1fr; }
    .side { display:contents; }
    .col, .center-panel { max-height:var(--h); overflow-y:auto; }
    .center-panel { height:var(--h); }
  }
  /* Écran moyen : 3 colonnes (les colonnes latérales s'empilent) */
  @media (min-width:1000px) and (max-width:1499px) {
    .side, .center-panel { max-height:var(--h); overflow-y:auto; }
    .center-panel { height:var(--h); }
  }
  /* Petit écran : une seule colonne, le centre en premier */
  @media (max-width:999px) { .grid { grid-template-columns:1fr; } .center-panel { order:-1; } .center-panel .center { min-height:70vh; } }
</style>
</head>
<body>
<div class="wrap">
  <header><strong>J.A.R.V.I.S</strong><span id="health">…</span></header>
  <div class="grid">
    <div class="side">
      <div class="col"><div class="panel"><h2>Volets &amp; aspirateur</h2><div id="g-m1"></div></div></div>
      <div class="col"><div class="panel"><h2>Lumières &amp; prises</h2><div id="g-m2"></div></div></div>
    </div>
    <div class="panel center-panel center">
      <div class="orb" id="orb"></div>
      <div class="title" id="otitle">J.A.R.V.I.S.</div>
      <div class="sub" id="osub">Chargement…</div>
      <div class="actions">
        <button id="diag">Lancer Auto-Diagnostic</button>
        <button id="voice">🔊 Rapport vocal</button>
      </div>
      <div class="dl">
        <a class="btn" href="api/report?format=html" download>HTML</a>
        <a class="btn" href="api/report?format=txt" download>TXT</a>
        <a class="btn" href="api/report?format=json" download>JSON</a>
        <button id="png">PNG</button>
      </div>
      <div id="log"></div>
      <div class="bar"><input id="q" placeholder="Parlez ou tapez votre demande pour Jarvis." autocomplete="off"><button id="go">Envoyer</button></div>
    </div>
    <div class="side">
      <div class="col"><div class="panel"><h2>Réseau &amp; caméras</h2><div id="g-network"></div></div></div>
      <div class="col">
        <div class="panel"><h2>Serveur &amp; services</h2><div id="g-system"></div></div>
        <div class="panel"><h2>Météo &amp; énergie</h2><div id="g-weather"></div></div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let lastStatus = null, lastAnalysis = null;
const KIND_LABEL = { vacuum:'Aspirateur', cover:'Volets & portes', light:'Lumières', plug:'Prises & ventilation', other:'Autres' };
const OVERALL = { ok:['J.A.R.V.I.S. ONLINE','var(--ok)'], warn:['ATTENTION','var(--warn)'], ko:['ALERTE SYSTÈME','var(--ko)'] };

function add(cls, t){ const d=document.createElement('div'); d.className=cls; d.textContent=t; $('log').appendChild(d); $('log').scrollTop=1e9; }

function renderItems(box, items, subheads){
  box.replaceChildren();
  if(!items.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='Aucune entité'; box.appendChild(e); return; }
  let lastKind=null;
  for(const it of items){
    if(subheads && it.kind!==lastKind){ lastKind=it.kind; const h=document.createElement('div'); h.className='sub-h'; h.textContent=KIND_LABEL[it.kind]||''; box.appendChild(h); }
    const row=document.createElement('div'); row.className='item';
    const dot=document.createElement('div'); dot.className='dot '+it.level;
    const txt=document.createElement('div'); const b=document.createElement('b'); b.textContent=it.name;
    const v=document.createElement('span'); v.className='v'; v.textContent=it.display;
    txt.append(b,v); row.append(dot,txt); box.appendChild(row);
  }
}
function renderStatus(s){
  lastStatus = s;
  const g = Object.fromEntries(s.groups.map(x=>[x.id,x.items]));
  const mods = g.modules||[];
  renderItems($('g-m1'), mods.filter(i=>['vacuum','cover'].includes(i.kind)), true);
  renderItems($('g-m2'), mods.filter(i=>!['vacuum','cover'].includes(i.kind)), true);
  renderItems($('g-network'), g.network||[], false);
  renderItems($('g-system'), g.system||[], false);
  renderItems($('g-weather'), g.weather||[], false);
  const [t,col] = OVERALL[s.overall];
  $('otitle').textContent = t; $('orb').style.setProperty('--oc', col); $('otitle').style.setProperty('--oc', col);
  $('osub').textContent = `${s.counts.ok} OK · ${s.counts.warn} attention · ${s.counts.ko} KO — ${s.generated}`;
  $('health').textContent = s.core.healthy ? ('Core OK · '+s.core.version) : 'Core injoignable';
}
async function refresh(){
  try { const r = await fetch('api/status'); renderStatus(await r.json()); }
  catch(e){ $('osub').textContent = 'Statut indisponible'; }
}

async function send(){
  const prompt=$('q').value.trim(); if(!prompt) return; $('q').value=''; add('me','> '+prompt);
  try {
    const r = await fetch('api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const j = await r.json();
    if(r.ok){ (j.actions||[]).forEach(a=>add('me','✔ '+a.domain+'.'+a.service+' → '+a.entity_id)); add('bot', j.response); setTimeout(refresh,1500); }
    else add('bot','Erreur: '+(j.detail||r.status));
  } catch(e){ add('bot','Erreur réseau: '+e); }
}

async function diagnostic(){
  const btn=$('diag'); btn.disabled=true; btn.textContent='Diagnostic en cours…'; add('me','> auto-diagnostic');
  try {
    const r = await fetch('api/diagnostic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analyse:true})});
    const j = await r.json(); if(!r.ok) throw new Error(j.detail||r.status);
    const rep=j.report; lastAnalysis=rep.analysis; renderStatus(rep);
    add('bot', `Statut : ${rep.overall_label}. ${rep.anomalies.length} anomalie(s).`);
    rep.anomalies.forEach(a=>add('bot',` - ${a.name} : ${a.display}`));
    if(rep.analysis) add('bot', rep.analysis);
  } catch(e){ add('bot','Erreur diagnostic: '+e.message); }
  btn.disabled=false; btn.textContent='Lancer Auto-Diagnostic';
}

async function rapportVocal(){
  const btn=$('voice'); btn.disabled=true; add('me','> rapport vocal');
  try {
    const r = await fetch('api/rapport',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const j = await r.json(); if(!r.ok) throw new Error(j.detail||r.status);
    lastAnalysis=j.report.analysis; renderStatus(j.report); add('bot', j.text);
    if(!j.speech.spoken) add('bot','(Non lu à voix haute : '+(j.speech.reason||'speak_service non configuré')+')');
  } catch(e){ add('bot','Erreur rapport: '+e.message); }
  btn.disabled=false;
}

function wrap(ctx, text, w){
  const out=[]; let line='';
  for(const word of text.split(/\s+/)){ const t=line?line+' '+word:word; if(ctx.measureText(t).width>w && line){ out.push(line); line=word; } else line=t; }
  if(line) out.push(line); return out;
}
function downloadPng(){
  const s=lastStatus; if(!s) return;
  const col={ok:'#19e68c',warn:'#ffb020',ko:'#ff4d5e'}, W=1100, P=40;
  const c=document.createElement('canvas'), ctx=c.getContext('2d');
  ctx.font='20px system-ui, sans-serif';
  const an = lastAnalysis ? wrap(ctx, lastAnalysis, W-2*P) : [];
  const groups = s.groups.filter(g=>g.items.length);
  const rows = groups.reduce((n,g)=>n+g.items.length+1,0);
  c.width=W; c.height = 200 + rows*38 + (an.length? an.length*28+60 : 0) + 50;
  ctx.fillStyle='#050b12'; ctx.fillRect(0,0,W,c.height);
  ctx.fillStyle='#00e5ff'; ctx.font='bold 34px ui-monospace, monospace'; ctx.fillText('J.A.R.V.I.S — Rapport système',P,70);
  ctx.fillStyle='#7fa3ad'; ctx.font='18px system-ui, sans-serif'; ctx.fillText('Généré le '+s.generated,P,100);
  ctx.fillStyle=col[s.overall]; ctx.font='bold 26px system-ui, sans-serif'; ctx.fillText(s.overall_label,P,145);
  ctx.fillStyle='#cfeff5'; ctx.font='18px system-ui, sans-serif';
  ctx.fillText(`${s.counts.ok} OK · ${s.counts.warn} attention · ${s.counts.ko} KO · Core ${s.core.healthy?('OK '+s.core.version):'injoignable'}`,P+260,145);
  let y=200;
  for(const g of groups){
    ctx.fillStyle='#00e5ff'; ctx.font='bold 20px system-ui, sans-serif'; ctx.fillText(g.title.toUpperCase(),P,y); y+=38;
    for(const it of g.items){
      ctx.fillStyle=col[it.level]; ctx.beginPath(); ctx.arc(P+8,y-6,7,0,7); ctx.fill();
      ctx.fillStyle='#e8fbff'; ctx.font='bold 19px system-ui, sans-serif'; ctx.fillText(it.name,P+28,y);
      ctx.fillStyle='#8fb3bd'; ctx.font='19px system-ui, sans-serif'; ctx.textAlign='right'; ctx.fillText(it.display,W-P,y); ctx.textAlign='left'; y+=38;
    }
  }
  if(an.length){ y+=20; ctx.fillStyle='#00e5ff'; ctx.font='bold 20px system-ui, sans-serif'; ctx.fillText('ANALYSE JARVIS',P,y); y+=34;
    ctx.fillStyle='#cfeff5'; ctx.font='20px system-ui, sans-serif'; an.forEach(l=>{ ctx.fillText(l,P,y); y+=28; }); }
  c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='jarvis-statut-'+s.generated.replace(/[ :]/g,m=>m===' '?'-':'')+'.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); });
}

$('go').onclick=send; $('diag').onclick=diagnostic; $('voice').onclick=rapportVocal; $('png').onclick=downloadPng;
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
add('bot','JARVIS : systèmes opérationnels. En attente de vos commandes textuelles.');
refresh(); setInterval(refresh, 20000);
</script>
</body>
</html>
