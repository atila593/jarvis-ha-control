name: Jarvis HA Control
version: "1.4.0"
slug: jarvis_ha_control
description: Assistant Gemini, HUD web et diagnostic système pour Home Assistant, avec réponse vocale Alexa optionnelle.
url: https://github.com/atila593/jarvis-ha-control
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: Jarvis
homeassistant_api: true
hassio_api: true
options:
  gemini_api_key: ""
  gemini_model: gemini-3.6-flash
  gemini_fallback_model: gemini-3.5-flash
  log_level: info
  speak_service: ""
  speak_targets: []
  auto_speak: false
  actions_enabled: true
  allowed_domains:
    - light
    - cover
    - vacuum
    - scene
  auto_discover: true
  extra_entities: []
  hidden_entities: []
schema:
  gemini_api_key: password
  gemini_model: str
  gemini_fallback_model: str?
  log_level: list(debug|info|warning|error)
  speak_service: str?
  speak_targets:
    - str
  auto_speak: bool
  actions_enabled: bool
  allowed_domains:
    - str
  auto_discover: bool
  extra_entities:
    - str
  hidden_entities:
    - str
